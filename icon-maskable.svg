<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Sixth Year">
  <!-- Full bleed: the launcher applies its own mask, so no rounded corners here -->
  <rect width="200" height="200" fill="#14213D"/>
  <!-- Artwork kept to 50% so it survives an aggressive circular crop -->
  <g transform="translate(50 50) scale(0.5)">
    <circle cx="100" cy="100" r="76" fill="none" stroke="#F4F2ED" stroke-opacity=".2" stroke-width="16"/>
    <circle cx="100" cy="100" r="76" fill="none" stroke="#F4F2ED" stroke-width="16" stroke-linecap="butt"
            stroke-dasharray="344 478" transform="rotate(-90 100 100)"/>
    <circle cx="100" cy="100" r="26" fill="#D9A441"/>
  </g>
</svg>
